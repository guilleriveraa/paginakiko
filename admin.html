<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Panel de Administración | Francisco Rivera e Hijo</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/admin-editor.css">
</head>

<body class="admin-page">

    <!-- ========== HEADER ADMIN ========== -->
    <header class="admin-header">
        <div class="container">
            <nav class="admin-nav">
                <div class="admin-nav-left">
                    <a href="admin.html" class="admin-logo">
                        <img src="img/logo.png" alt="Logo" height="35">
                        <span>Panel Admin</span>
                    </a>
                </div>
                <div class="admin-nav-right">
                    <span class="admin-user"><i class="fas fa-user-shield"></i> Administrador</span>
                    <button id="saveAllBtn" class="btn-save-all">
                        <i class="fas fa-save"></i> Guardar todo
                    </button>
                    <a href="admin-login.html" id="logoutBtn" class="btn-logout">
                        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <!-- ========== CONTENIDO ADMIN ========== -->
    <main class="admin-main">
        <div class="container">

            <!-- Mensaje de guardado -->
            <div id="saveMessage" class="save-message" style="display: none;">
                <i class="fas fa-check-circle"></i> Todos los cambios guardados correctamente
            </div>

            <!-- ===== SECCIÓN 1: ESTADÍSTICAS ===== -->
            <div class="admin-stats">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-layer-group"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="totalSections">5</span>
                        <span class="stat-label">Secciones</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-images"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="totalImages">0</span>
                        <span class="stat-label">Imágenes totales</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-file-alt"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="totalTexts">0</span>
                        <span class="stat-label">Textos editados</span>
                    </div>
                </div>
            </div>

            <!-- ===== SECCIÓN 2: EDITOR DE SECCIONES ===== -->
            <div class="admin-editor">
                <h2><i class="fas fa-edit"></i> Editor de contenido</h2>
                <p class="admin-subtitle">Gestiona las secciones, imágenes y textos de la galería</p>

                <!-- Navegación entre secciones -->
                <div class="admin-tabs" id="sectionTabs">
                    <button class="tab-btn active" data-section="cerrajeria">Cerrajería</button>
                    <button class="tab-btn" data-section="aluminio">Aluminio</button>
                    <button class="tab-btn" data-section="muebles">Muebles de Hierro</button>
                    <button class="tab-btn" data-section="barandillas">Barandillas</button>
                    <button class="tab-btn" data-section="varios">Varios</button>
                </div>

                <!-- Contenido de cada sección -->
                <div class="tab-content" id="tabContent">
                    <!-- Cada sección se genera con JavaScript -->
                </div>
            </div>

        </div>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">Panel de Administración</div>
                <p class="footer-copy">© 2026 Cerrajería Francisco Rivera e Hijo · <a href="aviso-legal.html">Aviso
                        legal</a></p>
            </div>
        </div>
    </footer>

    <!-- ========== JAVASCRIPT ========== -->
    <script src="js/admin-editor.js"></script>
    <script src="js/cookies.js"></script>

</body>

</html>
