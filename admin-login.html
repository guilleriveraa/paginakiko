<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Acceso Administración</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-login-page">

    <!-- ========== CONTENEDOR LOGIN ========== -->
    <div class="admin-login-container">
        <div class="admin-login-box">
            <div class="admin-login-logo">
                <img src="img/logo.png" alt="Cerrajería Francisco Rivera e Hijo">
                <h1>Administración</h1>
                <p>Panel de gestión de contenidos</p>
            </div>

            <form id="adminLoginForm" class="admin-login-form">
                <div class="form-group">
                    <label for="password">Contraseña de acceso</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Introduce la contraseña" required>
                        <button type="button" id="togglePassword" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="loginError" class="login-error" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i> Contraseña incorrecta. Inténtalo de nuevo.
                </div>

                <button type="submit" class="btn btn-login">
                    <i class="fas fa-lock"></i> Acceder
                </button>
            </form>

            <div class="admin-login-footer">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Volver a la web</a>
            </div>
        </div>
    </div>

    <!-- ========== JAVASCRIPT ========== -->
    <script src="js/admin-login.js"></script>

</body>

</html>
